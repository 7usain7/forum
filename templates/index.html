<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Forum — Home</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0}
    header{padding:12px 16px;border-bottom:1px solid #eee}
    main{max-width:900px;margin:24px auto;padding:0 16px}
    a.btn{display:inline-block;margin-right:8px;padding:8px 12px;border:1px solid #ddd;border-radius:8px;text-decoration:none;color:#222}
    a.btn.primary{background:#111;color:#fff;border-color:#111}
    button{padding:8px 12px;border-radius:8px;border:1px solid #111;background:#111;color:#fff;cursor:pointer}
  </style>
</head>
<body>
  <header><strong>Forum</strong></header>
  <main>
    {{if .Username}}
      <h1>Hi, {{.Username}} 👋</h1>
      <form method="post" action="/logout">
        <button type="submit">Logout</button>
      </form>
    {{else}}
      <h1>Welcome</h1>
      <p>Please login or register to continue.</p>
      <p>
        <a class="btn" href="/login">Login</a>
        <a class="btn primary" href="/register">Register</a>
      </p>
    {{end}}
  </main>
</body>
</html>
