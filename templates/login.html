<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0}
    header{padding:12px 16px;border-bottom:1px solid #eee}
    main{max-width:480px;margin:24px auto;padding:0 16px}
    label{display:block;margin-top:12px}
    input{width:100%;padding:10px;margin-top:6px;border:1px solid #ccc;border-radius:8px}
    button{margin-top:16px;padding:10px 14px;border-radius:8px;border:1px solid #111;background:#111;color:#fff;cursor:pointer}
    a{color:#06f;text-decoration:none}
  </style>
</head>
<body>
  <header>
    <strong>Forum</strong> — <a href="/">Home</a>
  </header>
  <main>
    <h1>Login</h1>
    <form method="post" action="/login">
      <label>Username
        <input type="text" name="username" required>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="/register">Register</a></p>
  </main>
</body>
</html>
