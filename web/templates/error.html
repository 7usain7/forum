<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Error 404</title>
    <link rel="icon" href="/static/icons/favicon.png" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .illustration {
            background: linear-gradient(to right, #6a11cb 0%, #2575fc 100%);
            padding: 40px 20px;
            text-align: center;
            color: white;
        }
        
        .illustration-content {
            max-width: 300px;
            margin: 0 auto;
        }
        
        .circle {
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }
        
        .content {
            padding: 40px;
            text-align: center;
        }
        
        h1 {
            font-size: 36px;
            color: #2d3436;
            margin-bottom: 20px;
        }
        
        p {
            font-size: 18px;
            color: #636e72;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .error-code {
            font-size: 100px;
            font-weight: bold;
            color: #d63031;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.1);
            margin: 20px 0;
        }
        
        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
        }
        
        .btn-primary {
            background: #6c5ce7;
            color: white;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }
        
        .btn-primary:hover {
            background: #5649c9;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.6);
        }
        
        @media (max-width: 600px) {
            .actions {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                text-align: center;
            }
            
            .error-code {
                font-size: 70px;
            }
            
            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="illustration">
            <div class="illustration-content">
                <div class="circle">⚠️</div>
                <h2>Oops! Page Not Found</h2>
            </div>
        </div>
        
        <div class="content">
            <div class="error-code">{{.Data.Code}}</div>
            
            <h1>{{.Data.Title}}</h1>
            
            <p>{{.Data.Message}}</p>
            
            <div class="actions">
                <a href="/" class="btn btn-primary">Go to Homepage</a>
            </div>
        </div>
    </div>
</body>
</html>
